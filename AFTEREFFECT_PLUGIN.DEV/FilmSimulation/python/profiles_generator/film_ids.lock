# film_ids.lock -- FROZEN per-stock identifiers. AUTHORITATIVE.
#
# WHY THIS FILE EXISTS
#
# Database order used to be derived by sorting the profile literal into natural
# name order. That made every stored identifier a function of which stock names
# happen to exist: eFILM_PROFILE values, film::GetFilmDatabase() subscripts and
# film_names.txt line numbers all moved when a stock was added. Adding a stock
# named "AGFA APX 50" would have taken index 1 and shifted all 160 after it, so
# every saved After Effects or Premiere project would silently have rendered a
# DIFFERENT FILM after a database update. film_enum.hpp's own advice -- "add at
# the end" -- was impossible to follow, because the sort chose the position and
# the author did not.
#
# Storage identity and presentation order are now separate concerns:
#   this file            frozen integer identity, never reused, never reordered
#   film_display_order.txt  generated, natural-name order, for the panel popup
#
# FORMAT   <id><TAB><name>, ascending by id, one per line.
#
# A WITHDRAWN STOCK becomes "<id><TAB>RETIRED <name>". Its identifier is
# consumed permanently and must never be reissued -- a reissued id would point
# a saved project at a different emulsion, which is the exact failure this file
# prevents.
#
# NEW STOCKS are auto-assigned max(id)+1 in natural-name order by
# cpp_codegen.sync_ids_lock(), which generate() calls. Importing film_profiles
# never writes here. Auto-assignment can only APPEND, so it cannot move an
# existing stock.
#
# SEEDED 2026-08-28 from the order then in force, which makes the freeze a
# provable no-op on the day it landed: id == index for all 161 stocks, and
# regeneration came out content-identical.
